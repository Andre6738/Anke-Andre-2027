<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin | André &amp; Anke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="admin-page">
    <div class="admin-brand">
      <div class="mono script">André &amp; Anke</div>
      <div class="admin-brand-sub">Gasheer-portaal</div>
    </div>

    <!-- LOGIN -->
    <div class="admin-card" id="admin-login">
      <h3 class="serif">Admin aanmelding</h3>
      <div class="sub">Slegs vir die paartjie. Meld aan om die RSVP-lys te sien.</div>
      <div class="admin-note" id="admin-config-note"></div>

      <button class="google-btn" id="google-signin" type="button">
        <span class="g">G</span> Meld aan met Google
      </button>

      <div class="or-divider"><span>of met e-pos</span></div>

      <form id="admin-form" novalidate>
        <label for="a-epos">E-pos</label>
        <input id="a-epos" type="email" placeholder="admin@epos.co.za" autocomplete="username">
        <label for="a-wag">Wagwoord</label>
        <input id="a-wag" type="password" placeholder="Wagwoord" autocomplete="current-password">
        <button class="btn" type="submit">Meld aan</button>
        <div class="form-msg" id="admin-msg"></div>
      </form>
    </div>

    <!-- PANEL -->
    <div class="admin-card wide" id="admin-panel" style="display:none;">
      <div class="admin-panel-head">
        <div>
          <h3 class="serif">RSVP-lys</h3>
          <div class="sub" id="admin-user"></div>
        </div>
        <button class="adminlink" id="admin-signout">Meld af</button>
      </div>
      <div class="admin-stats">
        <div class="s"><div class="sn" id="stat-total">0</div><div class="sl">Antwoorde</div></div>
        <div class="s"><div class="sn" id="stat-ja">0</div><div class="sl">Woon by</div></div>
        <div class="s"><div class="sn" id="stat-gaste">0</div><div class="sl">Gaste totaal</div></div>
        <div class="s"><div class="sn" id="stat-nee">0</div><div class="sl">Kan nie</div></div>
      </div>
      <div class="table-scroll">
        <table class="rsvp-table">
          <thead><tr><th>Naam</th><th>E-pos</th><th>Bywoon</th><th>Gaste</th><th>Dieet</th><th>Liedjie</th><th>Boodskap</th></tr></thead>
          <tbody id="rsvp-rows"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-back"><a href="../index.html">Terug na die webwerf</a></div>
  </div>

  <script src="../js/config.js"></script>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
