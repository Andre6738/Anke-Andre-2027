<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/favicon-180.png">
<title>Admin | André &amp; Anke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css?v=20260906a">
</head>
<body>

  <div class="admin-page">
    <div class="admin-brand">
      <div class="mono script">André &amp; Anke</div>
      <div class="admin-brand-sub">Host portal</div>
    </div>

    <!-- LOGIN -->
    <div class="admin-card" id="admin-login">
      <h3 class="serif">Admin login</h3>
      <div class="sub">For the couple only. Log in to see the RSVP list.</div>
      <div class="admin-note" id="admin-config-note"></div>

      <button class="google-btn" id="google-signin" type="button">
        <span class="g">G</span> Log in with Google
      </button>

      <div class="or-divider"><span>or with email</span></div>

      <form id="admin-form" novalidate>
        <label for="a-epos">Email</label>
        <input id="a-epos" type="email" placeholder="admin@example.com" autocomplete="username">
        <label for="a-wag">Password</label>
        <input id="a-wag" type="password" placeholder="Password" autocomplete="current-password">
        <button class="btn" type="submit">Log in</button>
        <div class="form-msg" id="admin-msg"></div>
      </form>
    </div>

    <!-- PANEL -->
    <div class="admin-card wide" id="admin-panel" style="display:none;">
      <div class="admin-panel-head">
        <div class="admin-panel-titles">
          <h3 class="serif">RSVP list</h3>
          <div class="sub" id="admin-user"></div>
        </div>
        <button class="signout-btn" id="admin-signout" type="button">Log out</button>
      </div>
      <div class="admin-stats">
        <div class="s"><div class="sn" id="stat-total">0</div><div class="sl">Responses</div></div>
        <div class="s"><div class="sn" id="stat-ja">0</div><div class="sl">Attending</div></div>
        <div class="s"><div class="sn" id="stat-gaste">0</div><div class="sl">Total people</div></div>
        <div class="s"><div class="sn" id="stat-nee">0</div><div class="sl">Not attending</div></div>
      </div>
      <div class="admin-toolbar">
        <div class="tb-title">Responses</div>
        <button class="btn-sm" id="rsvp-add" type="button">+ Add RSVP</button>
      </div>
      <div class="table-scroll">
        <table class="rsvp-table">
          <thead><tr><th>Name</th><th>Surname</th><th>Phone</th><th>Attending</th><th>Guests</th><th>Songs</th><th>Actions</th></tr></thead>
          <tbody id="rsvp-rows"></tbody>
        </table>
      </div>
    </div>

    <div class="admin-back"><a href="../index.html">Back to the website</a></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js" integrity="sha384-nLoOnA/BDh8A/jxqtckg4DumuCGOBYUnNJLZdQz/zfYNp3wcjGSoWTAzgko06G/2" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="../js/config.js?v=20260906a"></script>
  <script type="module" src="../js/admin.js?v=20260906a"></script>
</body>
</html>
